name: Medium 7x7 first review
on:
  push:
    branches: [medium-7x7]
    paths:
      - 'tests/medium-first-10.js'
      - '.github/workflows/medium-7x7-review.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard frozen Easy baseline
        run: |
          set -euo pipefail
          test "$(git hash-object engine/easy-6x6-profiles.js)" = "2ebdf4c3dac3afec23f9d2f1996ff49477676abb"
          test "$(git hash-object index.html)" = "1966017903d747b22b50491de932208a1f0cd448"
      - name: Build and commit Medium engine
        run: |
          set -euo pipefail
          python3 scripts/build-medium-7x7.py
          node --check engine/medium-7x7.js
          git add engine/medium-7x7.js
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add Medium 7x7 deterministic engine"
            git push origin HEAD:medium-7x7
          fi
      - name: Frozen Easy tests unchanged
        run: |
          set -euo pipefail
          node tests/easy-6x6-profiles.test.js
          node tests/easy-reproducibility.test.js
          node tests/repeated-objects.test.js
          node tests/fixed-object-footprint-size.test.js
          node tests/clue-pair-coherence.test.js
          node tests/solution-clue-consistency.test.js
          test "$(git hash-object engine/easy-6x6-profiles.js)" = "2ebdf4c3dac3afec23f9d2f1996ff49477676abb"
          test "$(git hash-object index.html)" = "1966017903d747b22b50491de932208a1f0cd448"
      - name: Medium architecture and advanced solver tests
        run: |
          set -euo pipefail
          node tests/medium-advanced-deductions.test.js
          node tests/medium-7x7-core.test.js
      - name: Generate exactly first 10 review puzzles
        run: |
          set -euo pipefail
          node tests/medium-first-10.js
      - name: Commit review reports
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/MEDIUM_FIRST_10_REPORT.json tests/MEDIUM_HUMAN_REVIEW.md
          if ! git diff --cached --quiet; then
            git commit -m "Store first Medium 7x7 review set"
            git push origin HEAD:medium-7x7
          fi
      - name: Reverify exact committed checkpoint
        run: |
          set -euo pipefail
          python3 scripts/build-medium-7x7.py
          node tests/medium-advanced-deductions.test.js
          node tests/medium-7x7-core.test.js
          node tests/medium-first-10.js
          git diff --exit-code -- engine/medium-7x7.js tests/MEDIUM_FIRST_10_REPORT.json tests/MEDIUM_HUMAN_REVIEW.md engine/easy-6x6-profiles.js index.html
          test "$(git hash-object engine/easy-6x6-profiles.js)" = "2ebdf4c3dac3afec23f9d2f1996ff49477676abb"
          test "$(git hash-object index.html)" = "1966017903d747b22b50491de932208a1f0cd448"
      - name: Exact Medium checkpoint
        run: |
          set -euo pipefail
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          echo "FROZEN_EASY_ENGINE=$(git hash-object engine/easy-6x6-profiles.js)"
          echo "FROZEN_EASY_UI=$(git hash-object index.html)"
          echo "MEDIUM_ENGINE=$(git hash-object engine/medium-7x7.js)"
          echo "REPORT_JSON=$(git hash-object tests/MEDIUM_FIRST_10_REPORT.json)"
          echo "REPORT_MD=$(git hash-object tests/MEDIUM_HUMAN_REVIEW.md)"
          test -z "$(git status --porcelain)"
