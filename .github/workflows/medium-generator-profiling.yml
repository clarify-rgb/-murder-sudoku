name: Medium generator diagnostic profiling
on:
  push:
    branches: [medium-7x7]
    paths:
      - 'tests/generator-profiling-diagnostic.js'
      - '.github/workflows/medium-generator-profiling.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard exact production baselines
        run: |
          set -euo pipefail
          test "$(git hash-object engine/medium-7x7.js)" = "59ef95e500ddb39fd43c905fc0f5c60b7bf52e96"
          test "$(git hash-object engine/easy-6x6-profiles.js)" = "2ebdf4c3dac3afec23f9d2f1996ff49477676abb"
          test "$(git hash-object index.html)" = "1966017903d747b22b50491de932208a1f0cd448"
      - name: Current Rules v2 regressions
        run: |
          set -euo pipefail
          node tests/rules-v2-semantics.test.js
          node tests/necessity-first-search.test.js
          node tests/multi-leaf-medium-search.test.js
          node tests/lazy-necessity-search.test.js
          node tests/easy-6x6-profiles.test.js
          node tests/easy-reproducibility.test.js
          node tests/repeated-objects.test.js
          node tests/fixed-object-footprint-size.test.js
          node tests/map-layer.test.js
          node tests/clue-pair-coherence.test.js
          node tests/solution-clue-consistency.test.js
      - name: Syntax-check diagnostic profiler
        run: node --check tests/generator-profiling-diagnostic.js
      - name: Run 10 new-board diagnostic profiling
        run: node tests/generator-profiling-diagnostic.js
      - name: Verify production engine behavior source unchanged
        run: |
          set -euo pipefail
          test "$(git hash-object engine/medium-7x7.js)" = "59ef95e500ddb39fd43c905fc0f5c60b7bf52e96"
          test "$(git hash-object engine/easy-6x6-profiles.js)" = "2ebdf4c3dac3afec23f9d2f1996ff49477676abb"
          test "$(git hash-object index.html)" = "1966017903d747b22b50491de932208a1f0cd448"
          test ! -e tests/.profiled-medium-7x7.js
      - name: Store profiling report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/GENERATOR_PROFILING_10_BOARD_REPORT.json
          if ! git diff --cached --quiet; then
            git commit -m "Store Medium generator profiling report"
            git push origin HEAD:medium-7x7
          fi
      - name: Exact diagnostic checkpoint
        run: |
          set -euo pipefail
          echo "DIAGNOSTIC_SHA=$(git rev-parse HEAD)"
          echo "PRODUCTION_ENGINE=$(git hash-object engine/medium-7x7.js)"
          echo "FROZEN_EASY_ENGINE=$(git hash-object engine/easy-6x6-profiles.js)"
          echo "FROZEN_EASY_UI=$(git hash-object index.html)"
          echo "PROFILE_REPORT=$(git hash-object tests/GENERATOR_PROFILING_10_BOARD_REPORT.json)"
          test "$(git hash-object engine/medium-7x7.js)" = "59ef95e500ddb39fd43c905fc0f5c60b7bf52e96"
          test -z "$(git status --porcelain)"
