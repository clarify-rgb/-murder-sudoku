name: Repeated diagonal stress audit
on:
  push:
    branches: [easy-6x6-profiles]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production checkpoint behavior unchanged before audit
        run: git diff --exit-code ef94b32b12ea5075512db9908e3784a10218167c -- engine/easy-6x6-profiles.js index.html
      - name: Engine syntax
        run: node --check engine/easy-6x6-profiles.js
      - name: Targeted repeated identity diagonal stress audit
        run: node tests/repeated-diagonal-stress.js
      - name: Show stress report
        run: cat tests/REPEATED_DIAGONAL_STRESS_REPORT.json
      - name: Store deterministic audit report
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add tests/REPEATED_DIAGONAL_STRESS_REPORT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Store repeated diagonal stress report"
          git push origin HEAD:easy-6x6-profiles
