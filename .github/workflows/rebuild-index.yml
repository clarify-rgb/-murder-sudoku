name: Rebuild index from uploaded source

on:
  push:
    branches: [main]
    paths:
      - 'index_parts/**'
      - '.github/workflows/rebuild-index.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact index.html
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          global.window = { __htmlParts: [] };
          for (const file of fs.readdirSync('index_parts').filter(f => f.endsWith('.js')).sort()) {
            vm.runInThisContext(fs.readFileSync(`index_parts/${file}`, 'utf8'), { filename: file });
          }
          const expectedLengths = [8000,8000,8000,8000,8000,8000,8000,8000,8000,3416];
          const parts = window.__htmlParts.map((part,i) => part.slice(0, expectedLengths[i]));
          fs.writeFileSync('index.html', Buffer.from(parts.join(''), 'base64'));
          NODE
          test "$(git hash-object index.html)" = "e43d4aee629ff3c3dd96485f9744eb26580a857c"
      - name: Commit reconstructed index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reconstruct uploaded HTML as index.html"
          git push
