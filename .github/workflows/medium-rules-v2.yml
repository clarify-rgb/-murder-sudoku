name: Medium Rules v2 correctness
on:
  push:
    branches: [medium-7x7]
    paths:
      - 'engine/medium-7x7.js'
      - 'tests/rules-v2-semantics.test.js'
      - 'tests/medium-7x7-core.test.js'
      - 'tests/medium-acceptance.test.js'
      - 'tests/medium-final-floor.test.js'
      - 'tests/medium-advanced-deductions.test.js'
      - 'tests/same-object-clue-pairs.test.js'
      - 'tests/necessity-first-search.test.js'
      - 'tests/multi-leaf-medium-search.test.js'
      - 'tests/lazy-necessity-search.test.js'
      - 'tests/wide-first-search-order.test.js'
      - '.github/workflows/medium-rules-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard frozen Easy
        run: |
          set -euo pipefail
          test "$(git hash-object engine/easy-6x6-profiles.js)" = "2ebdf4c3dac3afec23f9d2f1996ff49477676abb"
          test "$(git hash-object index.html)" = "1966017903d747b22b50491de932208a1f0cd448"
      - name: Syntax check Medium engine and tests
        run: |
          set -euo pipefail
          node --check engine/medium-7x7.js
          for file in \
            tests/rules-v2-semantics.test.js \
            tests/medium-7x7-core.test.js \
            tests/medium-acceptance.test.js \
            tests/medium-final-floor.test.js \
            tests/medium-advanced-deductions.test.js \
            tests/same-object-clue-pairs.test.js \
            tests/necessity-first-search.test.js \
            tests/multi-leaf-medium-search.test.js \
            tests/lazy-necessity-search.test.js \
            tests/wide-first-search-order.test.js; do
            node --check "$file"
          done
      - name: Run complete Medium correctness suite
        run: |
          set -euo pipefail
          node tests/rules-v2-semantics.test.js
          node tests/medium-7x7-core.test.js
          node tests/medium-acceptance.test.js
          node tests/medium-final-floor.test.js
          node tests/medium-advanced-deductions.test.js
          node tests/same-object-clue-pairs.test.js
          node tests/necessity-first-search.test.js
          node tests/multi-leaf-medium-search.test.js
          node tests/lazy-necessity-search.test.js
          node tests/wide-first-search-order.test.js
      - name: Recheck frozen Easy and clean checkout
        run: |
          set -euo pipefail
          test "$(git hash-object engine/easy-6x6-profiles.js)" = "2ebdf4c3dac3afec23f9d2f1996ff49477676abb"
          test "$(git hash-object index.html)" = "1966017903d747b22b50491de932208a1f0cd448"
          test -z "$(git status --porcelain)"
