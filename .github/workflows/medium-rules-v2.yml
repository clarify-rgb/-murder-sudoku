name: Medium Rules v2 lazy necessity checkpoint
on:
  push:
    branches: [medium-7x7]
    paths:
      - 'scripts/install-medium-rules-v2.py'
      - 'scripts/apply-necessity-first-search.py'
      - 'scripts/apply-multi-leaf-medium-search.py'
      - 'scripts/apply-lazy-necessity-search.py'
      - 'tests/necessity-first-search.test.js'
      - 'tests/multi-leaf-medium-search.test.js'
      - 'tests/lazy-necessity-search.test.js'
      - 'tests/lazy-necessity-diagnostic.js'
      - '.github/workflows/medium-rules-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard frozen Easy
        run: |
          set -euo pipefail
          test "$(git hash-object engine/easy-6x6-profiles.js)" = "2ebdf4c3dac3afec23f9d2f1996ff49477676abb"
          test "$(git hash-object index.html)" = "1966017903d747b22b50491de932208a1f0cd448"
      - name: Install Rules v2 lazy necessity generator
        run: |
          set -euo pipefail
          python3 scripts/install-medium-rules-v2.py
          node --check engine/medium-7x7.js
          git add engine/medium-7x7.js tests/rules-v2-semantics.test.js tests/rules-v2-medium-20.js
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Implement lazy necessity shared-counterexample search"
            git push origin HEAD:medium-7x7
          fi
      - name: Frozen Easy regressions
        run: |
          set -euo pipefail
          node tests/easy-6x6-profiles.test.js
          node tests/easy-reproducibility.test.js
          node tests/repeated-objects.test.js
          node tests/fixed-object-footprint-size.test.js
          node tests/map-layer.test.js
          node tests/clue-pair-coherence.test.js
          node tests/solution-clue-consistency.test.js
          test "$(git hash-object engine/easy-6x6-profiles.js)" = "2ebdf4c3dac3afec23f9d2f1996ff49477676abb"
          test "$(git hash-object index.html)" = "1966017903d747b22b50491de932208a1f0cd448"
      - name: Current Rules v2 generator regressions
        run: |
          set -euo pipefail
          node tests/rules-v2-semantics.test.js
          node tests/necessity-first-search.test.js
          node tests/multi-leaf-medium-search.test.js
          node tests/lazy-necessity-search.test.js
      - name: Ten new-board lazy necessity diagnostic
        run: |
          set -euo pipefail
          node tests/lazy-necessity-diagnostic.js
      - name: Store lazy necessity diagnostic report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/LAZY_NECESSITY_10_BOARD_REPORT.json
          if ! git diff --cached --quiet; then
            git commit -m "Store lazy necessity 10-board diagnostic"
            git push origin HEAD:medium-7x7
          fi
      - name: Reverify exact committed engine
        run: |
          set -euo pipefail
          python3 scripts/install-medium-rules-v2.py
          node --check engine/medium-7x7.js
          node tests/rules-v2-semantics.test.js
          node tests/necessity-first-search.test.js
          node tests/multi-leaf-medium-search.test.js
          node tests/lazy-necessity-search.test.js
          git diff --exit-code -- engine/medium-7x7.js tests/rules-v2-semantics.test.js tests/rules-v2-medium-20.js engine/easy-6x6-profiles.js index.html
          test "$(git hash-object engine/easy-6x6-profiles.js)" = "2ebdf4c3dac3afec23f9d2f1996ff49477676abb"
          test "$(git hash-object index.html)" = "1966017903d747b22b50491de932208a1f0cd448"
      - name: Exact lazy necessity checkpoint
        run: |
          set -euo pipefail
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          echo "RULESV2_ENGINE=$(git hash-object engine/medium-7x7.js)"
          echo "FROZEN_EASY_ENGINE=$(git hash-object engine/easy-6x6-profiles.js)"
          echo "FROZEN_EASY_UI=$(git hash-object index.html)"
          echo "DIAGNOSTIC_REPORT=$(git hash-object tests/LAZY_NECESSITY_10_BOARD_REPORT.json)"
          test -z "$(git status --porcelain)"
