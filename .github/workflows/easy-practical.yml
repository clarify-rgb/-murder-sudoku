name: Easy practical generator test
on:
  push:
    branches: [easy-6x6-profiles]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Semantic suite
        run: node tests/easy-6x6-profiles.test.js
      - name: Practical 25x3
        run: node tests/easy-25-practical.js
