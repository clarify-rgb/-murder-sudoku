name: Deploy approved Easy playtest
on:
  push:
    branches: [easy-6x6-profiles]
    paths: ['.github/workflows/deploy-approved-easy-test.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify audited production checkpoint
        run: |
          set -euo pipefail
          APPROVED=ef94b32b12ea5075512db9908e3784a10218167c
          AUDIT=d8e0b971997e849c80cc43f3ecab784a0cfff990
          git diff --exit-code "$APPROVED" "$AUDIT" -- engine/easy-6x6-profiles.js index.html
          git show "$APPROVED:engine/easy-6x6-profiles.js" > /tmp/easy-engine.js
          git show "$APPROVED:index.html" > /tmp/easy-player.html
          node --check /tmp/easy-engine.js
      - name: Lightweight final Easy smoke
        run: |
          set -euo pipefail
          node - <<'NODE'
          const E=require('/tmp/easy-engine.js');
          function seedHash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
          function seededRandom(seed){let a=seedHash(seed);return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
          function withSeed(seed,fn){const old=Math.random;Math.random=seededRandom(seed);try{return fn()}finally{Math.random=old}}
          function gen(profile,seed){return withSeed(seed,()=>E.generate(profile,6000))}
          function stable(P){return JSON.stringify({profile:P.profile,regionOf:P.regionOf,roomNames:P.roomNames,objects:P.objects,clues:P.clues,solution:P.solution})}
          for(const pr of ['easy-1','easy-2','easy-3']){
            const seed='FINAL-DEPLOY-'+pr;
            const P=gen(pr,seed); if(!P) throw Error('smoke generation failed '+pr);
            if(P.validation.solutions!==1) throw Error('nonunique '+pr);
            const s=E.strictSolve(P); if(!s.ok||s.searchCalls!==0) throw Error('human solve failed '+pr);
            const inv=E.validateStoredSolutionAgainstClues(P); if(!inv.valid) throw Error('stored solution/clue invariant failed '+pr);
            if(!E.fullValid(P,P.solution)) throw Error('stored solution is not fullValid '+pr);
            const P2=gen(pr,seed); if(!P2||stable(P)!==stable(P2)) throw Error('seed reproduction failed '+pr);
            console.log('SMOKE',pr,'PASS','attempts',P.generationAttempts);
          }
          let repeated=null;
          for(let i=0;i<80&&!repeated;i++){
            const pr=['easy-1','easy-2','easy-3'][i%3],P=gen(pr,'FINAL-RENDER-'+i); if(!P) continue;
            repeated=P.objects.find(o=>E.objectOccurrences(P,o.name).length>1)||null;
          }
          if(!repeated) throw Error('no repeated object found in deterministic smoke scan');
          console.log('REPEATED_OBJECT_SMOKE',repeated.name,'PASS');
          NODE
          grep -q "function validateStoredSolutionAgainstClues(P)" /tmp/easy-engine.js
          grep -q "function fullValid(P,a)" /tmp/easy-engine.js
          grep -q "objectOccurrenceExtents(P,cl.object)" /tmp/easy-engine.js
          grep -q "case'diagonal':return os.some(o=>diag(x,o))" /tmp/easy-engine.js
          grep -q "valid=E.fullValid(P,placed)" /tmp/easy-player.html
          grep -q "n===N&&valid?'<b>Puzzle solved!</b>'" /tmp/easy-player.html
          grep -q "E.objectOccurrences(P,o.name).find" /tmp/easy-player.html
          grep -q "E.blockedCell(P,{r,c})" /tmp/easy-player.html
          grep -q 'COPY PUZZLE DEBUG' /tmp/easy-player.html
          grep -q 'LOAD PUZZLE ID' /tmp/easy-player.html
          grep -q 'New Puzzle' /tmp/easy-player.html
      - name: Copy exact approved production checkpoint to main easy-test
        run: |
          set -euo pipefail
          APPROVED=ef94b32b12ea5075512db9908e3784a10218167c
          git fetch origin main
          APPROVED_ENGINE=$(git rev-parse "$APPROVED:engine/easy-6x6-profiles.js")
          APPROVED_PLAYER=$(git rev-parse "$APPROVED:index.html")
          MAIN_INDEX_HASH=$(git rev-parse origin/main:index.html)
          MAIN_BEFORE=$(git rev-parse origin/main)
          git checkout -B main origin/main
          mkdir -p easy-test/engine
          git show "$APPROVED:engine/easy-6x6-profiles.js" > easy-test/engine/easy-6x6-profiles.js
          git show "$APPROVED:index.html" > easy-test/index.html
          test "$(git hash-object easy-test/engine/easy-6x6-profiles.js)" = "$APPROVED_ENGINE"
          test "$(git hash-object easy-test/index.html)" = "$APPROVED_PLAYER"
          test "$(git rev-parse HEAD:index.html)" = "$MAIN_INDEX_HASH"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add easy-test/engine/easy-6x6-profiles.js easy-test/index.html
          if git diff --cached --quiet; then
            echo "No deployed file changes were necessary"
          else
            git commit -m "Deploy final approved Easy 6x6 playtest"
            git push origin main
          fi
          DEPLOYED_SHA=$(git rev-parse HEAD)
          test "$(git rev-list --parents -n 1 "$DEPLOYED_SHA" | wc -w)" -eq 2
          if [ "$DEPLOYED_SHA" != "$MAIN_BEFORE" ]; then
            test "$(git rev-parse "$DEPLOYED_SHA^")" = "$MAIN_BEFORE"
          fi
          echo "DEPLOYED_SHA=$DEPLOYED_SHA" >> "$GITHUB_ENV"
          echo "APPROVED_ENGINE=$APPROVED_ENGINE" >> "$GITHUB_ENV"
          echo "APPROVED_PLAYER=$APPROVED_PLAYER" >> "$GITHUB_ENV"
          echo "MAIN_INDEX_HASH=$MAIN_INDEX_HASH" >> "$GITHUB_ENV"
      - name: Verify deployed hashes and main index
        run: |
          set -euo pipefail
          git fetch origin main
          DEPLOYED_ENGINE=$(git rev-parse origin/main:easy-test/engine/easy-6x6-profiles.js)
          DEPLOYED_PLAYER=$(git rev-parse origin/main:easy-test/index.html)
          CURRENT_MAIN_INDEX=$(git rev-parse origin/main:index.html)
          test "$DEPLOYED_ENGINE" = "$APPROVED_ENGINE"
          test "$DEPLOYED_PLAYER" = "$APPROVED_PLAYER"
          test "$CURRENT_MAIN_INDEX" = "$MAIN_INDEX_HASH"
          echo "Deployed commit: $DEPLOYED_SHA"
          echo "Production source: ef94b32b12ea5075512db9908e3784a10218167c"
          echo "Approved/deployed engine hash: $DEPLOYED_ENGINE"
          echo "Approved/deployed player hash: $DEPLOYED_PLAYER"
          echo "Main index hash: $CURRENT_MAIN_INDEX"
