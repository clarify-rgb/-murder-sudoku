name: Easy multi-cell tests
on:
  push:
    branches: [easy-6x6-profiles]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply map layer
        run: |
          sed -i '6s/"$/"""/' scripts/apply-map-layer.py
          python3 scripts/apply-map-layer.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('engine/easy-6x6-profiles.js');s=p.read_text()
          s=s.replace('function regionGrid(){return generateRegionGrid()}','function regionGrid(){return Array.from({length:N},(_,r)=>Array.from({length:N},(_,c)=>Math.floor(r/2)*2+Math.floor(c/3)))}')
          s=s.replace("function buildCandidate(profileId){if(!PROFILES[profileId])return null;let R=regionGrid();","function buildCandidate(profileId){if(!PROFILES[profileId])return null;let R=generateRegionGrid();")
          p.write_text(s)
          PY
      - name: Syntax
        run: node --check engine/easy-6x6-profiles.js
      - name: Existing semantics
        run: node tests/easy-6x6-profiles.test.js
      - name: Map semantics
        run: node tests/map-layer.test.js
      - name: Practical 10x3
        run: node tests/map-practical-10x3.js
      - name: Commit exact tested implementation
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add engine/easy-6x6-profiles.js index.html tests/map-layer.test.js tests/map-practical-10x3.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add variable rooms and locked Easy objects"
          git push origin HEAD:easy-6x6-profiles
