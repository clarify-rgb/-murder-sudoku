name: Easy multi-cell tests
on:
  push:
    branches: [easy-6x6-profiles]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture 1HBGDQC regression geometry
        run: node tests/dump-clue-pair-regression.js
      - name: Syntax
        run: node --check engine/easy-6x6-profiles.js
      - name: Existing semantics
        run: node tests/easy-6x6-profiles.test.js
      - name: Map semantics
        run: node tests/map-layer.test.js
      - name: Repeated object semantics
        run: node tests/repeated-objects.test.js
