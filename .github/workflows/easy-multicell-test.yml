name: Easy multi-cell tests
on:
  push:
    branches: [easy-6x6-profiles]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify solution/clue safety patch is present
        run: python3 scripts/apply-solution-clue-safety.py
      - name: Engine syntax
        run: node --check engine/easy-6x6-profiles.js
      - name: Solution/clue repeated-object regressions
        run: node tests/solution-clue-consistency.test.js
      - name: Existing clue-pair regression and synthetic tests
        run: node tests/clue-pair-coherence.test.js
      - name: Existing semantics 22
        run: node tests/easy-6x6-profiles.test.js
      - name: Map semantics 14
        run: node tests/map-layer.test.js
      - name: Repeated object semantics 12
        run: node tests/repeated-objects.test.js
      - name: Reproducibility regression
        run: node tests/easy-reproducibility.test.js
      - name: Submit canonical validation safety
        run: |
          grep -F "valid=E.fullValid(P,placed)" index.html
          grep -F "<b>Puzzle solved!</b>" index.html
      - name: Practical stored-solution clue audit 20x3
        run: node tests/solution-clue-practical-20x3.js
      - name: Ensure exact checkpoint remains unchanged by test preparation
        run: |
          git diff --exit-code engine/easy-6x6-profiles.js index.html
          git diff --exit-code tests/SOLUTION_CLUE_CONSISTENCY_REPORT.json
