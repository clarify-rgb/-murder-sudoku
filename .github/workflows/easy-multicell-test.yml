name: Easy multi-cell tests
on:
  push:
    branches: [easy-6x6-profiles]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply clue-pair coherence safeguard
        run: python3 scripts/apply-clue-pair-coherence.py
      - name: Syntax
        run: node --check engine/easy-6x6-profiles.js
      - name: Clue-pair regression and synthetic tests
        run: node tests/clue-pair-coherence.test.js
      - name: Existing semantics 22
        run: node tests/easy-6x6-profiles.test.js
      - name: Map semantics 14
        run: node tests/map-layer.test.js
      - name: Repeated object semantics 12
        run: node tests/repeated-objects.test.js
      - name: Practical clue-pair audit 20x3
        run: node tests/clue-pair-practical-20x3.js
      - name: Store tested metrics
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add engine/easy-6x6-profiles.js tests/CLUE_PAIR_PRACTICAL_REPORT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Store clue-pair checkpoint results"
          git push origin HEAD:easy-6x6-profiles
