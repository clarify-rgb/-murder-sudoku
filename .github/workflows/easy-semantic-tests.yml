name: Easy semantic tests
on:
  push:
    branches: [easy-6x6-profiles]
  workflow_dispatch:
jobs:
  semantic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check engine
        run: node --check engine/easy-6x6-profiles.js
      - name: Syntax check tests
        run: node --check tests/easy-6x6-profiles.test.js
      - name: Semantic tests
        run: node tests/easy-6x6-profiles.test.js
