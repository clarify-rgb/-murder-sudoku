<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Murder Sudoku — Easy 6×6 chain test</title><style>
:root{--bg:#f4f2f6;--panel:#fff;--ink:#202024;--muted:#6d6972;--accent:#5b9cf6;--border:#26262a}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}button,.person,.cell{-webkit-tap-highlight-color:transparent}.wrap{max-width:1120px;margin:auto;padding:16px}.header{display:flex;justify-content:space-between;gap:10px;align-items:center}.header h1{font-size:22px;margin:0}.header p{font-size:12px;color:var(--muted);margin:3px 0}.newbtn,.profile-btn,.controls button{border:2px solid var(--border);background:#fff;border-radius:9px;padding:8px 11px;font-weight:850}.newbtn,.controls .primary{background:#f6df9a}.profilebar{display:flex;gap:6px;align-items:center;margin:9px 0}.profile-btn.active{background:#eaf3ff;border-color:var(--accent)}.game{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}.panel,.board-panel{background:#fff;border:2px solid var(--border);border-radius:14px;padding:10px;min-width:0}.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.person{border:2px solid var(--border);border-radius:9px;overflow:hidden;background:#fff;min-width:0}.person.selected{border-color:var(--accent);box-shadow:0 0 0 2px #eaf3ff}.person.placed{opacity:.45}.name{text-align:center;font-weight:950;padding:4px}.clue{border-top:1px solid #bbb;background:#fafafa;padding:5px;min-height:48px;font-size:11px;line-height:1.15;text-align:center;display:flex;align-items:center;justify-content:center}.case-title{text-align:center}.case-title h2{font-size:18px;margin:0}.case-title p{font-size:11px;color:var(--muted);margin:3px 0 7px}.board{width:100%;max-width:100%;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));border:4px solid #111;overflow:hidden}.cell{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}.cell.auto-x{background-image:linear-gradient(#2222,#2222)}.object{font-size:15px;font-weight:950}.notes{position:absolute;inset:2px;display:flex;gap:1px;flex-wrap:wrap;align-content:flex-start}.note{font-size:9px;font-weight:900;background:#fffB;border:1px solid #999;border-radius:2px;padding:0 2px}.final{width:60%;aspect-ratio:1;border:2px solid #111;border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:950}.xmark{font-size:28px;font-weight:950}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px;position:static}.controls button{min-width:0;padding:8px 3px}.controls button.active{background:#eaf3ff;border-color:var(--accent)}.feedback,.debug,.engine{margin-top:6px;padding:6px 8px;border-radius:7px;font-size:11px}.feedback{background:#fafafa;border:1px solid #ccc}.debug{border:1px dashed #999;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.engine{background:#eff8ef;border:1px solid #cdd9cc;color:#3f5940}
@media(max-width:760px){.wrap{padding:calc(6px + env(safe-area-inset-top)) 7px 10px}.header h1{font-size:16px}.header p{display:none}.newbtn{font-size:11px;padding:7px 9px}.profilebar{margin:6px 0;font-size:11px}.profile-btn{font-size:10px;padding:6px 8px}.game{display:flex;flex-direction:column;gap:6px}.panel,.board-panel{padding:6px;border-radius:10px;width:100%;overflow:visible}.panel h2{display:none}.people{width:100%;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,auto);gap:4px;overflow:visible}.person{width:100%}.name{font-size:12px;padding:2px}.clue{min-height:35px;padding:3px;font-size:9px;line-height:1.08}.case-title h2{font-size:14px}.case-title p{font-size:9px;margin-bottom:4px}.board{width:100%;height:auto;aspect-ratio:1/1;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr))}.controls{position:static!important;bottom:auto!important;margin-top:6px}.controls button{font-size:10px;min-height:38px}.feedback,.debug,.engine{font-size:9px;margin-top:4px;padding:5px}.object{font-size:12px}.note{font-size:8px}.xmark{font-size:22px}}
</style></head><body><div class="wrap"><div class="header"><div><h1>Murder Sudoku — Easy chain test</h1><p>Validator rejects direct-coordinate pseudo-puzzles.</p></div><button id="newPuzzleBtn" class="newbtn">New Puzzle</button></div><div class="profilebar"><b>Profile:</b><button class="profile-btn active" data-profile="easy-1">Easy 1</button><button class="profile-btn" data-profile="easy-2">Easy 2</button><button class="profile-btn" data-profile="easy-3">Easy 3</button></div><div class="game"><section class="panel"><h2>People</h2><div id="people" class="people"></div></section><section class="board-panel"><div class="case-title"><h2 id="caseTitle"></h2><p>Place A–F. One person per row and column. F is the victim.</p></div><div id="board" class="board"></div><div class="controls"><button id="eraserMode">⌫ Eraser</button><button id="undoBtn">↶ Undo</button><button id="clearBtn">Reset</button><button id="submitBtn" class="primary">SUBMIT</button></div><div id="feedback" class="feedback"></div><div id="debug" class="debug"></div><div id="engineBox" class="engine"></div></section></div></div><script src="engine/easy-6x6-profiles.js"></script><script>
(()=>{'use strict';const E=window.Easy6Engine,N=E.N,colors=['#F4C95D','#7BC8F6','#8ED081','#D79BE7','#F29A8A','#9FA8DA'];let profile='easy-1',P,selected=null,mode='normal',notes={},placed={},history=[];const board=document.getElementById('board'),people=document.getElementById('people'),feedback=document.getElementById('feedback'),undo=document.getElementById('undoBtn'),key=(r,c)=>r+','+c,same=(a,b)=>a&&b&&a.r===b.r&&a.c===b.c,at=(r,c)=>Object.keys(placed).find(p=>same(placed[p],{r,c})),autoX=(r,c)=>!at(r,c)&&Object.values(placed).some(x=>x.r===r||x.c===c);function snap(){return{selected,mode,notes:Object.fromEntries(Object.entries(notes).map(([k,v])=>[k,[...v]])),placed:JSON.parse(JSON.stringify(placed))}}function restore(s){selected=s.selected;mode=s.mode;notes={};Object.entries(s.notes).forEach(([k,v])=>notes[k]=new Set(v));placed=s.placed;render()}function push(){history.push(snap());if(history.length>80)history.shift()}function reset(){selected=null;mode='normal';notes={};placed={};history=[]}function renderPeople(){people.innerHTML='';P.people.forEach(p=>{const d=document.createElement('div');d.className='person'+(selected===p?' selected':'')+(placed[p]?' placed':'');d.innerHTML=`<div class="name">${p}</div><div class="clue">${(P.clues[p]||[]).map(c=>c.text).join('<br>')}</div>`;d.onclick=()=>{selected=selected===p?null:p;render()};people.appendChild(d)})}function note(r,c){if(!selected||autoX(r,c))return;push();const k=key(r,c);if(!notes[k])notes[k]=new Set;notes[k].has(selected)?notes[k].delete(selected):notes[k].add(selected);render()}function final(r,c){if(!selected||autoX(r,c))return;push();delete placed[selected];const old=at(r,c);if(old)delete placed[old];placed[selected]={r,c};Object.keys(notes).forEach(k=>{notes[k].delete(selected);if(!notes[k].size)delete notes[k]});render()}function clear(r,c){push();delete notes[key(r,c)];const old=at(r,c);if(old)delete placed[old];render()}function renderBoard(){board.innerHTML='';for(let r=0;r<N;r++)for(let c=0;c<N;c++){const d=document.createElement('div'),rid=P.regionOf[r][c];d.className='cell'+(autoX(r,c)?' auto-x':'');d.style.background=colors[rid];d.style.borderTop=(r===0||P.regionOf[r-1][c]!==rid?4:1)+'px solid #171717';d.style.borderBottom=(r===N-1||P.regionOf[r+1][c]!==rid?4:1)+'px solid #171717';d.style.borderLeft=(c===0||P.regionOf[r][c-1]!==rid?4:1)+'px solid #171717';d.style.borderRight=(c===N-1||P.regionOf[r][c+1]!==rid?4:1)+'px solid #171717';const o=P.objects.find(x=>x.r===r&&x.c===c);if(o){const s=document.createElement('span');s.className='object';s.textContent=o.icon;d.appendChild(s)}const who=at(r,c);if(who){const f=document.createElement('div');f.className='final';f.textContent=who;d.appendChild(f)}else if(autoX(r,c)){const x=document.createElement('div');x.className='xmark';x.textContent='✕';d.appendChild(x)}else if(notes[key(r,c)]){const n=document.createElement('div');n.className='notes';[...notes[key(r,c)]].forEach(v=>{const s=document.createElement('span');s.className='note';s.textContent=v;n.appendChild(s)});d.appendChild(n)}let timer=null,held=false,down=false;d.onpointerdown=e=>{e.preventDefault();down=true;held=false;if(mode==='eraser')return;timer=setTimeout(()=>{if(down){held=true;final(r,c)}},800)};d.onpointerup=e=>{e.preventDefault();down=false;if(timer)clearTimeout(timer);if(mode==='eraser')clear(r,c);else if(!held)note(r,c)};d.onpointerleave=d.onpointercancel=()=>{down=false;if(timer)clearTimeout(timer)};board.appendChild(d)}}function render(){if(!P)return;renderPeople();renderBoard();undo.disabled=!history.length;document.getElementById('eraserMode').classList.toggle('active',mode==='eraser');document.getElementById('caseTitle').textContent=E.PROFILES[P.profile].label;const m=P.validation.metrics,ic=Object.entries(m.initialCandidates).map(([p,n])=>p+':'+n).join(' ');document.getElementById('debug').textContent=`${P.profile} · initial ${ic} · direct singles ${m.directClueSingles} · row/col ${m.rowColumnForcedDeductions} · relational ${m.relationalDeductions} · forced ${m.totalForcedSteps} · attempts ${P.generationAttempts}`;document.getElementById('engineBox').textContent='✅ 1 solution · no guessing · no globals · elimination-chain validator passed'}function load(){const next=E.generate(profile,500);if(!next){feedback.textContent='Generation failed after 500 attempts.';return}P=next;reset();render();feedback.textContent='Tap = note · hold = final placement.'}document.querySelectorAll('.profile-btn').forEach(b=>b.onclick=()=>{profile=b.dataset.profile;document.querySelectorAll('.profile-btn').forEach(x=>x.classList.toggle('active',x===b));feedback.textContent=E.PROFILES[profile].label+' selected. Press New Puzzle.'});document.getElementById('newPuzzleBtn').onclick=load;document.getElementById('eraserMode').onclick=()=>{mode=mode==='eraser'?'normal':'eraser';render()};undo.onclick=()=>{if(history.length)restore(history.pop())};document.getElementById('clearBtn').onclick=()=>{push();notes={};placed={};selected=null;render()};document.getElementById('submitBtn').onclick=()=>{if(Object.keys(placed).length<N){feedback.textContent=`Placed ${Object.keys(placed).length} of ${N}.`;return}const n=P.people.filter(p=>same(placed[p],P.solution[p])).length;feedback.innerHTML=n===N?`<b>CASE SOLVED ✅</b> — ${P.culprit} was the culprit.`:`Not quite. ${n} of ${N} placements are correct.`};load()})();
</script></body></html>
