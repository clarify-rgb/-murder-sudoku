<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Murder Sudoku — Easy 6×6</title><style>:root{--bg:#f4f2f6;--ink:#202024;--accent:#5b9cf6;--border:#26262a}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}.wrap{max-width:1000px;margin:auto;padding:8px}.header,.profilebar{display:flex;gap:6px;align-items:center;justify-content:space-between}.header h1{font-size:17px;margin:2px 0}.profilebar{justify-content:flex-start;margin:5px 0}.profile-btn,.newbtn,.controls button{border:2px solid var(--border);background:#fff;border-radius:8px;padding:6px 8px;font-weight:800}.profile-btn.active{background:#eaf3ff}.game{display:grid;grid-template-columns:280px minmax(0,1fr);gap:8px}.panel,.board-panel{background:#fff;border:2px solid var(--border);border-radius:10px;padding:6px;min-width:0}.panel h2{font-size:14px;margin:0 0 4px}.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}.person{border:2px solid var(--border);border-radius:7px;overflow:hidden}.person.selected{border-color:var(--accent)}.person.placed{opacity:.45}.name{text-align:center;font-weight:950;font-size:12px;padding:2px}.clue{border-top:1px solid #bbb;padding:3px;font-size:10px;line-height:1.12;min-height:34px;display:flex;align-items:center;justify-content:center;text-align:center}.case-title{text-align:center}.case-title h2{font-size:14px;margin:0}.case-title p{font-size:9px;margin:1px 0 3px}.board{aspect-ratio:1/1;width:min(100%,calc(100dvh - 116px));margin:auto;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);border:4px solid #111;overflow:hidden}.cell{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none}.object-footprint{position:absolute;inset:10%;background:#ffffff66;border:2px solid #333;z-index:0}.object{position:relative;z-index:1;font-size:11px;font-weight:900;background:#fff;border:1px solid #333;border-radius:50%;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center}.notes,.final,.xmark{z-index:2}.notes{position:absolute;inset:2px;display:flex;gap:1px;flex-wrap:wrap}.note{font-size:8px;background:#fffb;border:1px solid #999}.final{width:58%;aspect-ratio:1;border:2px solid #111;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:950}.xmark{font-size:20px;font-weight:950}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:5px auto 0;max-width:min(100%,calc(100dvh - 116px));padding-bottom:max(2px,env(safe-area-inset-bottom))}.controls button{font-size:10px;min-height:34px;padding:4px 2px}.controls .primary{background:#f6df9a}.feedback,.debug,.engine{font-size:9px;margin-top:3px;padding:4px;border:1px solid #ccc;border-radius:5px}.debug{font-family:ui-monospace,monospace}.engine{background:#eff8ef}@media(max-width:760px){.game{display:flex;flex-direction:column;gap:5px}.panel h2{display:none}.people{grid-template-rows:repeat(3,auto)}.board-panel{padding:4px}.board{width:min(calc(100vw - 22px),calc(100dvh - 112px));max-width:100%}.controls{width:min(calc(100vw - 22px),calc(100dvh - 112px));max-width:100%}.header h1{font-size:15px}.profile-btn,.newbtn{font-size:10px;padding:5px 7px}.clue{font-size:9px;min-height:30px;padding:2px}.name{font-size:11px}.feedback,.debug,.engine{font-size:8px}}</style></head><body><div class="wrap"><div class="header"><h1>Murder Sudoku — Easy</h1><button id="newPuzzleBtn" class="newbtn">New Puzzle</button></div><div class="profilebar"><b>Profile:</b><button class="profile-btn active" data-profile="easy-1">Easy 1</button><button class="profile-btn" data-profile="easy-2">Easy 2</button><button class="profile-btn" data-profile="easy-3">Easy 3</button></div><div class="game"><section class="panel"><h2>People</h2><div id="people" class="people"></div></section><section class="board-panel"><div class="case-title"><h2 id="caseTitle"></h2><p>One person per row and column. F is the victim.</p></div><div id="board" class="board"></div><div class="controls"><button id="eraserMode">⌫ Eraser</button><button id="undoBtn">↶ Undo</button><button id="clearBtn">Reset</button><button id="submitBtn" class="primary">SUBMIT</button></div><div id="feedback" class="feedback"></div><div id="debug" class="debug"></div><div id="engineBox" class="engine"></div></section></div></div><script src="engine/easy-6x6-profiles.js"></script><script>(()=>{'use strict';const E=window.Easy6Engine,N=E.N,colors=['#F4C95D','#7BC8F6','#8ED081','#D79BE7','#F29A8A','#9FA8DA'];let profile='easy-1',P,selected=null,mode='normal',notes={},placed={},history=[];const board=document.getElementById('board'),people=document.getElementById('people'),feedback=document.getElementById('feedback'),undo=document.getElementById('undoBtn'),key=(r,c)=>r+','+c,same=(a,b)=>a&&b&&a.r===b.r&&a.c===b.c,at=(r,c)=>Object.keys(placed).find(p=>same(placed[p],{r,c})),autoX=(r,c)=>!at(r,c)&&Object.values(placed).some(x=>x.r===r||x.c===c);function snap(){return{selected,mode,notes:Object.fromEntries(Object.entries(notes).map(([k,v])=>[k,[...v]])),placed:JSON.parse(JSON.stringify(placed))}}function restore(s){selected=s.selected;mode=s.mode;notes={};Object.entries(s.notes).forEach(([k,v])=>notes[k]=new Set(v));placed=s.placed;render()}function push(){history.push(snap())}function reset(){selected=null;mode='normal';notes={};placed={};history=[]}function renderPeople(){people.innerHTML='';P.people.forEach(p=>{let d=document.createElement('div');d.className='person'+(selected===p?' selected':'')+(placed[p]?' placed':'');d.innerHTML=`<div class="name">${p}</div><div class="clue">${(P.clues[p]||[]).map(c=>c.text).join('<br>')}</div>`;d.onclick=()=>{selected=selected===p?null:p;render()};people.appendChild(d)})}function note(r,c){if(!selected||autoX(r,c)||E.blockedCell(P,{r,c}))return;push();let k=key(r,c);if(!notes[k])notes[k]=new Set;notes[k].has(selected)?notes[k].delete(selected):notes[k].add(selected);render()}function final(r,c){if(!selected||autoX(r,c)||E.blockedCell(P,{r,c}))return;push();delete placed[selected];let old=at(r,c);if(old)delete placed[old];placed[selected]={r,c};Object.values(notes).forEach(s=>s.delete(selected));render()}function clear(r,c){push();delete notes[key(r,c)];let old=at(r,c);if(old)delete placed[old];render()}function renderBoard(){board.innerHTML='';for(let r=0;r<N;r++)for(let c=0;c<N;c++){let d=document.createElement('div'),rid=P.regionOf[r][c],here={r,c};d.className='cell';d.style.background=colors[rid];d.style.borderTop=(r===0||P.regionOf[r-1][c]!==rid?4:1)+'px solid #171717';d.style.borderBottom=(r===N-1||P.regionOf[r+1][c]!==rid?4:1)+'px solid #171717';d.style.borderLeft=(c===0||P.regionOf[r][c-1]!==rid?4:1)+'px solid #171717';d.style.borderRight=(c===N-1||P.regionOf[r][c+1]!==rid?4:1)+'px solid #171717';let o=P.objects.find(o=>E.objectCells(P,o.name).some(x=>same(x,here)));if(o){let fp=document.createElement('span');fp.className='object-footprint';let cs=E.objectCells(P,o.name),has=(rr,cc)=>cs.some(x=>x.r===rr&&x.c===cc);if(has(r,c-1))fp.style.borderLeft='0';if(has(r,c+1))fp.style.borderRight='0';if(has(r-1,c))fp.style.borderTop='0';if(has(r+1,c))fp.style.borderBottom='0';d.appendChild(fp);if(same(here,cs[0])){let s=document.createElement('span');s.className='object';s.textContent=o.icon;d.appendChild(s)}}let who=at(r,c);if(who){let f=document.createElement('div');f.className='final';f.textContent=who;d.appendChild(f)}else if(autoX(r,c)){let x=document.createElement('div');x.className='xmark';x.textContent='✕';d.appendChild(x)}else if(notes[key(r,c)]){let n=document.createElement('div');n.className='notes';[...notes[key(r,c)]].forEach(v=>{let s=document.createElement('span');s.className='note';s.textContent=v;n.appendChild(s)});d.appendChild(n)}let timer,held=false,down=false;d.onpointerdown=e=>{e.preventDefault();down=true;held=false;if(mode==='eraser')return;timer=setTimeout(()=>{if(down){held=true;final(r,c)}},800)};d.onpointerup=e=>{e.preventDefault();down=false;clearTimeout(timer);if(mode==='eraser')clear(r,c);else if(!held)note(r,c)};d.onpointercancel=d.onpointerleave=()=>{down=false;clearTimeout(timer)};board.appendChild(d)}}function render(){if(!P)return;renderPeople();renderBoard();undo.disabled=!history.length;document.getElementById('eraserMode').classList.toggle('active',mode==='eraser');document.getElementById('caseTitle').textContent=E.PROFILES[P.profile].label;let m=P.validation.metrics;document.getElementById('debug').textContent=`direct ${m.directClueSingles} · row/col ${m.rowColumnForcedDeductions} · occupancy ${m.rowColumnOccupancyDeductions} · relational ${m.relationalDeductions} · attempts ${P.generationAttempts}`;document.getElementById('engineBox').textContent='✅ unique · no guessing · no Easy globals · ≤2 clues/person'}function load(){let n=E.generate(profile,2000);if(!n){feedback.textContent='Generation failed.';return}P=n;reset();render();feedback.textContent='Tap = note · hold = final.'}document.querySelectorAll('.profile-btn').forEach(b=>b.onclick=()=>{profile=b.dataset.profile;document.querySelectorAll('.profile-btn').forEach(x=>x.classList.toggle('active',x===b));load()});document.getElementById('newPuzzleBtn').onclick=load;document.getElementById('eraserMode').onclick=()=>{mode=mode==='eraser'?'normal':'eraser';render()};undo.onclick=()=>history.length&&restore(history.pop());document.getElementById('clearBtn').onclick=()=>{push();notes={};placed={};selected=null;render()};document.getElementById('submitBtn').onclick=()=>{if(Object.keys(placed).length<N){feedback.textContent=`Placed ${Object.keys(placed).length} of ${N}.`;return}let n=P.people.filter(p=>same(placed[p],P.solution[p])).length;feedback.innerHTML=n===N?`<b>CASE SOLVED ✅</b> — ${P.culprit} was the culprit.`:`Not quite. ${n} of ${N} placements are correct.`};load()})();</script></body></html>
